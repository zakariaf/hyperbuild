<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="hyperbuild">
  <title>hyperbuild</title>
  <defs>
    <linearGradient id="hbWavesTileBanner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2340"/>
      <stop offset="1" stop-color="#0B101F"/>
    </linearGradient>
  </defs>
  <!-- contained backdrop: banner reads identically on light and dark pages -->
  <rect width="1200" height="300" rx="40" fill="url(#hbWavesTileBanner)"/>
