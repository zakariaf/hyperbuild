  </g>
  <text x="380" y="186" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" font-size="140" letter-spacing="-5"><tspan fill="#45C4FF">hyper</tspan><tspan fill="#EAEFFA">build</tspan></text>
</svg>
