<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="hyperbuild">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#161D30"/>
      <stop offset="1" stop-color="#0C1120"/>
    </linearGradient>
    <linearGradient id="hgrad" x1="84" y1="71" x2="378" y2="441" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9B6DFF"/>
      <stop offset="1" stop-color="#5A5BE8"/>
    </linearGradient>
  </defs>

  <style>
    .wm-n { fill: #212938; }
    @media (prefers-color-scheme: dark) {
      .wm-n { fill: #EEF1F8; }
    }
  </style>

  <!-- mark: 512 grid scaled to a 224px tile -->
  <g transform="translate(130,38) scale(0.4375)">
    <rect width="512" height="512" rx="116" fill="url(#tile)"/>
    <g fill="url(#hgrad)">
      <rect x="84" y="147" width="66" height="66" rx="12"/>
      <rect x="84" y="223" width="66" height="66" rx="12"/>
      <rect x="84" y="299" width="66" height="66" rx="12"/>
      <rect x="84" y="375" width="66" height="66" rx="12"/>
      <rect x="160" y="223" width="66" height="66" rx="12"/>
      <rect x="236" y="223" width="66" height="66" rx="12"/>
      <rect x="312" y="299" width="66" height="66" rx="12"/>
      <rect x="312" y="375" width="66" height="66" rx="12"/>
    </g>
    <g fill="none" stroke="#3ADCF0" stroke-width="4" opacity="0.4">
      <rect x="86" y="73" width="62" height="62" rx="11"/>
      <rect x="314" y="225" width="62" height="62" rx="11"/>
    </g>
    <g fill="#3ADCF0">
      <rect x="112" y="33" width="66" height="66" rx="12"/>
      <rect x="362" y="153" width="66" height="66" rx="12"/>
      <rect x="422" y="105" width="36" height="36" rx="8"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="400" y="189" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" font-size="138" letter-spacing="-4"><tspan class="wm-n" fill="#737C8C">hyper</tspan><tspan fill="#7D6CF5">build</tspan></text>
</svg>
