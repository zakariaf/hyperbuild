<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="hyperbuild">
  <title>hyperbuild</title>
  <defs>
    <linearGradient id="hbWavesTile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2340"/>
      <stop offset="1" stop-color="#0B101F"/>
    </linearGradient>
  </defs>
  <!-- contained backdrop tile: works on light and dark pages -->
  <rect width="512" height="512" rx="116" fill="url(#hbWavesTile)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="3"/>
  <!-- four layers on a 76px vertical rhythm, stroke 44, arms 122..390, apex rise 80 -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="44">
    <!-- wave 1 (earliest, fading into depth) -->
    <path d="M122 410 L256 330 L390 410" stroke="#45C4FF" stroke-opacity="0.42"/>
    <!-- wave 2 -->
    <path d="M122 334 L256 254 L390 334" stroke="#45C4FF" stroke-opacity="0.68"/>
    <!-- the gate: an opened layer — the moment of human choice -->
    <path d="M122 258 L214 203" stroke="#FFB224"/>
    <path d="M298 203 L390 258" stroke="#FFB224"/>
    <!-- wave 3 (through the gate, shipping) -->
    <path d="M122 182 L256 102 L390 182" stroke="#45C4FF"/>
  </g>
</svg>
