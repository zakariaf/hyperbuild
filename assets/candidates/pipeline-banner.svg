<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="hyperbuild">
  <title>hyperbuild</title>
  <defs>
    <linearGradient id="pipe" gradientUnits="userSpaceOnUse" x1="84" y1="92" x2="428" y2="438">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="252" cy="150" r="300">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- contained backdrop tile: works on any page background -->
  <rect x="4" y="4" width="1192" height="292" rx="32" fill="#0F172A"/>
  <rect x="4" y="4" width="1192" height="292" rx="32" fill="url(#glow)"/>
  <rect x="4" y="4" width="1192" height="292" rx="32" fill="none" stroke="#475569" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- mark, scaled from the 512 grid; mark center (256,256) maps to (252,150) -->
  <g transform="translate(159.54 57.84) scale(0.36)">
    <g fill="none" stroke="url(#pipe)" stroke-width="44" stroke-linecap="round">
      <path d="M 427.49 225.41 A 176 176 0 0 0 376.03 136.28"/>
      <path d="M 376.03 393.72 A 176 176 0 0 0 427.49 304.59"/>
      <path d="M 204.54 433.31 A 176 176 0 0 0 307.46 433.31"/>
      <path d="M 84.51 304.59 A 176 176 0 0 0 135.97 393.72"/>
      <path d="M 135.97 136.28 A 176 176 0 0 0 84.51 225.41"/>
    </g>
    <circle cx="256" cy="89" r="28" fill="none" stroke="#F59E0B" stroke-width="24"/>
    <path d="M 216 187 L 296 265 L 216 343" fill="none" stroke="url(#pipe)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <text x="365" y="184" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" font-size="132" letter-spacing="-3"><tspan fill="#E2E8F0">hyper</tspan><tspan fill="#818CF8">build</tspan></text>
</svg>
